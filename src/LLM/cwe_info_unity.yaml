# prompts/cwe_info_unity.yaml

CWE_1219:
  id: 1219
  short_description: File and Path Handling Issues
  long_description: |
    Improper file and path handling in Unity or C# applications may lead to path traversal,
    missing resource loading, or privilege misuse. In VR scenarios, runtime-loaded assets
    such as prefabs or configuration files can be influenced by user input or external data.
    If file paths or load targets are not validated, this can result in unauthorized access
    or runtime exceptions. Focus on unvalidated file path concatenations, external input used
    in file operations, and lack of null checks after resource loading.
  examples:
    sources:
      - package: "System.IO"
        class: "File"
        method: "ReadAllText"
        signature: "string ReadAllText(string path)"
        note: "Path controlled by external input can be a taint source."
      - package: "UnityEngine"
        class: "Resources"
        method: "Load"
        signature: "Object Load(string path)"
        note: "Unvalidated resource path may return null or unexpected data."
      - package: "UnityEngine"
        class: "PlayerPrefs"
        method: "GetString"
        signature: "string GetString(string key)"
        note: "External configuration keys or values may act as input sources."

    sinks:
      - package: "System.IO"
        class: "File"
        method: "WriteAllText"
        signature: "void WriteAllText(string path, string contents)"
        sink_args: ["path", "contents"]
        note: "Writing to arbitrary paths can lead to overwriting sensitive files."
      - package: "System.IO"
        class: "File"
        method: "Open"
        signature: "FileStream Open(string path, FileMode mode)"
        sink_args: ["path"]
        note: "Opening arbitrary paths may result in privilege escalation or leaks."

    taint_propagators:
      - package: "System.IO"
        class: "Path"
        method: "Combine"
        signature: "string Combine(params string[] paths)"
        note: "Combines unvalidated path fragments and propagates taint."
      - package: "UnityEngine"
        class: "Resources"
        method: "LoadAll"
        signature: "Object[] LoadAll(string path)"
        note: "Propagates tainted resource path through bulk loading."

CWE_0355:
  id: 355
  short_description: UI / Input Handling Issues
  long_description: |
    Improper handling of user interface (UI) and input data can allow unvalidated user input
    to reach critical logic layers. In Unity VR environments, inputs may come from UI text fields,
    controllers, gestures, or voice commands. If the input is not validated for type, range,
    or nullness, it can lead to exceptions, unwanted actions, or security exposure.
    Focus on unchecked UI callbacks, direct data binding, or configuration parameters from users.
  examples:
    sources:
      - package: "UnityEngine.UI"
        class: "InputField"
        method: "get_text"
        signature: "string get_text()"
        note: "Text input from user interface is a common taint source."
      - package: "UnityEngine"
        class: "Touch"
        method: "position"
        signature: "Vector2 position"
        note: "Raw touch or controller input can be unvalidated user data."

    sinks:
      - package: "UnityEngine"
        class: "Debug"
        method: "Log"
        signature: "void Log(object message)"
        sink_args: ["message"]
        note: "Logging unfiltered input may cause log injection or data exposure."
      - package: "UnityEngine.SceneManagement"
        class: "SceneManager"
        method: "LoadScene"
        signature: "void LoadScene(string sceneName)"
        sink_args: ["sceneName"]
        note: "Loading scenes based on user-controlled input may cause instability."

    taint_propagators:
      - package: "UnityEngine.Events"
        class: "UnityEvent"
        method: "Invoke"
        signature: "void Invoke()"
        note: "Event system propagates tainted data through callbacks."
      - package: "System"
        class: "String"
        method: "Format"
        signature: "string Format(string format, params object[] args)"
        note: "Combines tainted input into formatted strings for downstream use."

CWE_0465:
  id: 465
  short_description: Pointer / Null Reference Issues
  long_description: |
    CWE-465 covers pointer and reference issues such as null dereferences or invalid object access.
    In managed C# environments like Unity, this often manifests as NullReferenceExceptions or
    uninitialized references. In Unity VR, such issues are common when calling GetComponent or Find
    without validation, using destroyed objects, or accessing XR devices before initialization.
    Focus on APIs that return null, dereference objects without checks, or propagate potentially null references.
  examples:
    sources:
      - package: "UnityEngine"
        class: "Component"
        method: "GetComponent"
        signature: "T GetComponent<T>()"
        note: "Returns null if the requested component does not exist."
      - package: "UnityEngine"
        class: "GameObject"
        method: "Find"
        signature: "GameObject Find(string name)"
        note: "Returns null if the object is not found."

    sinks:
      - package: "UnityEngine"
        class: "Object"
        method: "ToString"
        signature: "string ToString()"
        sink_args: ["this"]
        note: "Dereferencing null objects triggers NullReferenceException."
      - package: "UnityEngine"
        class: "Transform"
        method: "get_position"
        signature: "Vector3 get_position()"
        sink_args: ["this"]
        note: "Accessing a null transform reference causes runtime errors."

    taint_propagators:
      - package: "UnityEngine"
        class: "Component"
        method: "GetComponentInChildren"
        signature: "T GetComponentInChildren<T>()"
        note: "Propagates possibly null reference to caller."
      - package: "UnityEngine"
        class: "Object"
        method: "Instantiate"
        signature: "T Instantiate<T>(T original)"
        note: "Passing null as original will propagate null and cause exceptions."

CWE_1218:
  id: 1218
  short_description: Memory / Resource Leak Issues
  long_description: |
    In managed C# systems, memory leaks often occur due to unclosed resources,
    event subscriptions, or un-destroyed Unity objects. In Unity VR, improper management
    of textures, streams, or event listeners can lead to frame drops or crashes.
    Focus on unclosed FileStreams, missing Destroy/Dispose calls, or persistent references
    preventing garbage collection.
  examples:
    sources:
      - package: "System.IO"
        class: "FileStream"
        method: "Open"
        signature: "FileStream Open(string path, FileMode mode)"
        note: "Streams not wrapped in using-blocks can leak file handles."
      - package: "UnityEngine"
        class: "Texture2D"
        method: "LoadImage"
        signature: "bool LoadImage(byte[] data)"
        note: "Repeated texture creation without Destroy leaks GPU memory."

    sinks:
      - package: "System"
        class: "GC"
        method: "Collect"
        signature: "void Collect()"
        sink_args: []
        note: "Calling GC manually doesn’t fix leaks; unmanaged resources must be freed properly."
      - package: "UnityEngine"
        class: "Object"
        method: "Destroy"
        signature: "void Destroy(Object obj)"
        sink_args: ["obj"]
        note: "Failure to call Destroy results in persistent memory usage."

    taint_propagators:
      - package: "System"
        class: "EventHandler"
        method: "add"
        signature: "void add(EventHandler handler)"
        note: "Unremoved event handlers keep objects alive and uncollectable."
      - package: "System.IDisposable"
        class: "Stream"
        method: "Dispose"
        signature: "void Dispose()"
        note: "Neglecting Dispose keeps unmanaged resources allocated."

